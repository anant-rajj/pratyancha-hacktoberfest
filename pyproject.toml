[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veripack"
version = "0.1.0"
description = "Published Package vs. Source Code Integrity Analyzer"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Team Pratyancha", email = "anantraj.clcs@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
  "requests>=2.31.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
